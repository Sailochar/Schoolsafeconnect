name: school_safe_connect_mobile
description: "Production School Safe Connect Flutter Mobile Application for Parents, Teachers, and Drivers"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.0.0
  http: ^1.2.1
  socket_io_client: ^2.0.3+1
  intl: ^0.19.0
  geolocator: ^11.0.0
  flutter_windowmanager: ^0.2.0
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  file_picker: ^11.0.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
